<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MiPlayer">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>MiPlayer</title>
<style>
:root{
  --accent:#1ED760;--bg:#121212;--surface:#262626;--text:#fff;--sec:#b3b3b3;--on-accent:#000;
  --radius:8px;--track:rgba(128,128,128,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
#app{position:fixed;inset:0}
#view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 14px) 16px calc(var(--dock,150px) + 20px)}
.title{font-size:28px;font-weight:800;margin:6px 0 16px;letter-spacing:-.3px}
h2{font-size:20px;font-weight:700;margin:26px 0 12px}
.sec{color:var(--sec)}
.grow{flex:1}
.row{display:flex;align-items:center;gap:12px}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.ib:active{opacity:.6}
.on{color:var(--accent)}

/* dock: mini reproductor + pestañas con efecto cristal */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:var(--sab);background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid rgba(128,128,128,.14)}
#tabs{display:flex;padding:6px 6px 4px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--sec);transition:color .15s}
#tabs button .pill{display:flex;align-items:center;justify-content:center;width:58px;height:30px;border-radius:15px;transition:background .2s,transform .15s}
#tabs button:active .pill{transform:scale(.92)}
#tabs button.tsel{color:var(--text)}
#tabs button.tsel .pill{background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--accent)}
#mini{padding:8px 10px 0}
#mini:empty{padding:0}
.miniin{border-radius:calc(var(--radius) + 6px);padding:8px 8px 6px;display:flex;flex-direction:column;gap:6px;background:var(--surface);box-shadow:0 6px 20px rgba(0,0,0,.28);transition:background .4s}
.miniin .row{gap:10px}
.miniin .art{width:42px;height:42px}
.mt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ma{font-size:12px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:2px;border-radius:2px;background:var(--track);overflow:hidden}
.pbar>div{height:100%;width:0;background:var(--text)}

/* art */
.art{aspect-ratio:1;border-radius:var(--radius);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;color:rgba(255,255,255,.75)}
.art.circle{border-radius:50%}
.art svg{width:45%;height:45%}

/* cards */
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.card{width:150px;flex:none;text-align:left;display:block}
.card.fluid{width:auto}
.card.center{text-align:center}
.card .art{width:100%}
.card .ct{font-size:14px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cs{font-size:12px;color:var(--sec);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.quick button{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius);overflow:hidden;text-align:left;font-size:13px;font-weight:600;min-height:52px}
.quick .art{width:52px;height:52px;border-radius:var(--radius) 0 0 var(--radius)}
.quick span{padding-right:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;height:96px;border-radius:var(--radius);overflow:hidden;text-align:left;padding:10px;font-weight:700;font-size:15px;color:#fff}
.tile span{display:block;max-width:60%}
.tile .art{position:absolute;right:-10px;bottom:-6px;width:58px;transform:rotate(25deg);box-shadow:0 3px 8px rgba(0,0,0,.4)}

/* list rows */
.list{display:flex;flex-direction:column}
.tr{display:flex;align-items:center;gap:4px;content-visibility:auto;contain-intrinsic-size:auto 58px}
.tr .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:5px 0}
.tr .art{width:48px;height:48px}
.compact .tr .art{width:38px;height:38px}
.tr .tt{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ts{font-size:12.5px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.tr.cur .tt{color:var(--accent)}
.tr .tx{min-width:0;flex:1}
.eq-ico{display:none;color:var(--accent)}
.tr.cur.playing .eq-ico{display:inline-flex}
.lrow{display:flex;align-items:center;gap:12px;padding:6px 0;width:100%;text-align:left}
.lrow .art{width:56px;height:56px}
.lrow .tx{min-width:0;flex:1}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip.sel{background:var(--accent);color:var(--on-accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:var(--surface);color:var(--text)}
.btn.danger{background:transparent;color:#ff5a5f;border:1px solid #ff5a5f55}
.btn.sm{padding:8px 14px;font-size:14px}
.bar{display:flex;align-items:center;margin:0 0 6px -8px;position:sticky;top:calc(var(--sat) * -1)}
.hdr{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:4px 0 14px}
.hdr .art{width:210px;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.hdr h1{font-size:23px;margin:0}
.playbtn{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.detail{margin:calc(var(--sat) * -1 - 14px) -16px 0;padding:calc(var(--sat) + 14px) 16px 0}
.search{width:100%;padding:12px 14px;border-radius:var(--radius);border:0;background:var(--surface);outline:none;font-size:16px;margin-bottom:16px}
.search::placeholder{color:var(--sec)}
.empty{text-align:center;padding:28px 10px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty svg{color:var(--accent)}
.note{font-size:13px;color:var(--sec);line-height:1.45}
.box{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.box h3{margin:0 0 6px;font-size:15px}

/* settings */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border-bottom:1px solid rgba(128,128,128,.15);min-height:48px}
.setgrp{border-radius:var(--radius);overflow:hidden;margin-bottom:6px}
.setgrp .setrow:last-child{border-bottom:0}
.grp-t{font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.5px;margin:22px 4px 8px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--track);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
input[type=color]{width:44px;height:32px;border:0;padding:0;background:none;border-radius:6px}
select{background:var(--bg);border:1px solid rgba(128,128,128,.35);border-radius:8px;padding:7px 8px}
input[type=text]{background:var(--bg);border:1px solid rgba(128,128,128,.35);border-radius:8px;padding:9px 10px;outline:none;width:100%}
.presets{display:flex;gap:12px;overflow-x:auto;padding:12px 14px;background:var(--surface);scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.pv{flex:none;width:72px;text-align:center;font-size:11px}
.pv i{display:block;width:64px;height:64px;border-radius:10px;position:relative;margin:0 auto 6px;border:1px solid rgba(128,128,128,.4)}
.pv i b{position:absolute;left:23px;top:10px;width:18px;height:18px;border-radius:50%}
.pv i u{position:absolute;left:13px;bottom:10px;width:38px;height:14px;border-radius:6px}

/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--p:0%;--fill:var(--text)}
input[type=range].acc{--fill:var(--accent)}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fill) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);margin-top:-6px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;background:var(--fill)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--text)}

/* overlays */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
#layer>*{pointer-events:auto}
.back{position:fixed;inset:0;background:rgba(0,0,0,.55);animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .25s ease-out;padding-bottom:var(--sab);box-shadow:0 -6px 30px rgba(0,0,0,.4)}
.sheet.tall{height:88%}
.sh-h{display:flex;align-items:center;padding:12px 8px 6px 18px;font-weight:700;font-size:17px}
.sh-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 20px;min-height:0}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;text-align:left;font-size:16px}
.act.danger{color:#ff5a5f}
.dlg{position:fixed;left:24px;right:24px;top:30%;background:var(--surface);border-radius:14px;padding:18px;animation:fade .15s;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.dlg h3{margin:0 0 6px;font-size:17px}
.dlg .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 10px);transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:90;box-shadow:0 4px 14px rgba(0,0,0,.4);max-width:90%;text-align:center;display:none}

/* now playing */
.np{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--sat) + 8px) 24px calc(var(--sab) + 14px);animation:up .28s ease-out;overflow:hidden}
.np .bgart{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.45;z-index:0;transform:scale(1.4)}
.np .bgfade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent,var(--bg) 90%);z-index:0}
.np>*:not(.bgart):not(.bgfade){position:relative;z-index:1}
.np .top{display:flex;align-items:center}
.np .top .mid{flex:1;text-align:center;min-width:0}
.np .top small{display:block;font-size:10px;letter-spacing:.6px;color:var(--sec);font-weight:600}
.np .top b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .cover{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:14px 4px}
.np .cover .art{width:100%;max-width:min(100%,46vh);box-shadow:0 16px 40px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.np .cover .art.paused{transform:scale(.87)}
.np .ti{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.np .ti .tx{flex:1;min-width:0}
.np .ti h1{font-size:22px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .ti p{margin:2px 0 0;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .times{display:flex;justify-content:space-between;font-size:11px;color:var(--sec);font-variant-numeric:tabular-nums;margin-top:-2px}
.np .ctl{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px}
.np .big{width:70px;height:70px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.np .bot{display:flex;align-items:center;justify-content:space-between;padding-top:4px}
.np .bot button{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}

/* vertical eq */
.eqrow{display:flex}
.eqc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--sec)}
.vs{position:relative;width:100%;height:190px;touch-action:none}
.vs-in{position:absolute;top:10px;bottom:10px;left:0;right:0}
.vs-track{position:absolute;left:calc(50% - 2px);width:4px;top:-10px;bottom:-10px;border-radius:2px;background:var(--surface)}
.vs-mid{position:absolute;left:calc(50% - 6px);width:12px;height:1px;top:50%;background:var(--sec);opacity:.6}
.vs-fill{position:absolute;left:calc(50% - 2px);width:4px;background:var(--accent);border-radius:2px}
.vs-thumb{position:absolute;left:calc(50% - 10px);width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.sl{margin-bottom:14px}
.sl .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:2px}
.sl .l span:last-child{color:var(--sec);font-variant-numeric:tabular-nums}
.prof{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.prof button.p{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius);padding:12px;text-align:left}

/* ===== pulido ===== */
#view.enter>*{animation:enter .34s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(3){animation-delay:.04s}
#view.enter>*:nth-child(4){animation-delay:.08s}
#view.enter>*:nth-child(5){animation-delay:.12s}
#view.enter>*:nth-child(n+6){animation-delay:.16s}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card,.lrow,.quick button,.tile,.hero,.tr .main,.chip,.btn,.setrow,.res,.opt{transition:transform .12s ease,opacity .12s,background .2s}
.card:active,.lrow:active,.quick button:active,.tile:active,.hero:active{transform:scale(.97)}
.tr .main:active,.setrow:active,.res:active,.opt:active{opacity:.65}
.art{box-shadow:0 2px 8px rgba(0,0,0,.22)}
.card .art{box-shadow:0 8px 18px rgba(0,0,0,.32)}
.hs{scroll-snap-type:x proximity}
.hs .card{scroll-snap-align:start}
.title{font-size:30px;font-weight:800;letter-spacing:-.6px}
h2{font-size:21px;font-weight:800;letter-spacing:-.3px}
.glow{position:absolute;left:0;right:0;top:0;height:380px;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 0% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 72%)}
.hero{display:flex;gap:14px;align-items:center;width:100%;padding:12px;border-radius:calc(var(--radius) + 8px);text-align:left;margin-bottom:14px;box-shadow:0 10px 28px rgba(0,0,0,.3);color:#fff}
.hero .art{width:78px;height:78px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.hero small{display:block;font-size:10.5px;letter-spacing:.7px;font-weight:700;opacity:.8;text-transform:uppercase}
.hero b{display:block;font-size:17px;margin:3px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .a{display:block;font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .go{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.hero .tx{flex:1;min-width:0}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;margin-bottom:14px;gap:2px}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--sec);transition:background .2s,color .2s}
.seg button.sel{background:var(--accent);color:var(--on-accent)}
.sform{display:flex;gap:8px;margin-bottom:14px}
.sform .search{margin:0;flex:1}
.res{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}
.res .thumb{width:104px;aspect-ratio:16/9;border-radius:calc(var(--radius) - 2px);background-size:cover;background-position:center;background-color:var(--surface);position:relative;flex:none;overflow:hidden}
.res .thumb.sq{width:56px;aspect-ratio:1}
.res .thumb i{position:absolute;right:4px;bottom:4px;font-style:normal;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.78);color:#fff;padding:1px 5px;border-radius:4px}
.res .tx{flex:1;min-width:0}
.res .rt{font-size:14.5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.res .rs{font-size:12.5px;color:var(--sec);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:2px 6px;border-radius:4px;color:#fff;margin-right:6px;vertical-align:1px}
.badge.yt{background:#e62117}.badge.sp{background:#1db954}.badge.have{background:var(--accent);color:var(--on-accent)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--accent);animation:rot .8s linear infinite;margin:30px auto}
@keyframes rot{to{transform:rotate(360deg)}}
.handle{width:38px;height:4px;border-radius:2px;background:var(--track);margin:0 auto 6px}
.swatches{display:flex;gap:10px;padding:12px 14px;background:var(--surface);overflow-x:auto;scrollbar-width:none}
.swatches::-webkit-scrollbar{display:none}
.swatches button{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.swatches button.sel{border-color:var(--text)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border-bottom:1px solid rgba(128,128,128,.15);width:100%;text-align:left}
.opt .rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--sec);flex:none;margin-top:2px;position:relative}
.opt.sel .rad{border-color:var(--accent)}
.opt.sel .rad::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.opt b{display:block;font-size:15px}
.pill-timer{align-self:center;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--surface);color:var(--accent);margin-bottom:6px}
.ifr{width:100%;border:0;border-radius:12px;background:#000;display:block}
.np{background:linear-gradient(180deg,var(--tint,var(--bg)) 0%,var(--bg) 85%)}
.np .cover .art{box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 60px -10px var(--tint,transparent)}
.field{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--surface);border-bottom:1px solid rgba(128,128,128,.15)}
input,textarea,select{-webkit-user-select:text;user-select:text}
.field label{font-size:13px;color:var(--sec)}
.vwrap{position:relative;width:min(100%,46vh);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.vwrap::before{content:"";position:absolute;left:-8%;top:3%;width:106%;height:106%;border-radius:50%;background:radial-gradient(circle closest-side,var(--tint,transparent) 0,transparent 78%);opacity:.55;filter:blur(18px);transition:opacity .6s}
.vwrap.idle::before{opacity:.25}
.rec{position:absolute;left:2%;top:13%;width:86%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle closest-side,transparent 0 56%,rgba(255,255,255,.07) 56.4%,transparent 58%,transparent 76%,rgba(255,255,255,.07) 76.4%,transparent 78%),
  repeating-radial-gradient(circle at 50% 50%,#0d0d0d 0 1.4px,#1b1b1b 1.4px 2.4px,#101010 2.4px 3.2px);
  box-shadow:0 18px 38px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.5),inset 0 0 0 3px #060606,inset 0 0 0 5px rgba(255,255,255,.05);will-change:transform}
.sheen{position:absolute;left:2%;top:13%;width:86%;aspect-ratio:1;border-radius:50%;pointer-events:none;z-index:1;
  background:conic-gradient(from -35deg,transparent 0 16%,rgba(255,255,255,.17) 24%,transparent 32% 66%,rgba(255,255,255,.10) 75%,transparent 84%)}
.rec .lab{position:absolute;inset:34%;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12)}
.rec .lab::after{content:"";position:absolute;left:50%;top:50%;width:13%;aspect-ratio:1;margin:-6.5% 0 0 -6.5%;border-radius:50%;background:radial-gradient(circle,#050505 0 45%,#8a8a8a 50%,#2b2b2b 70%)}
.arm{position:absolute;inset:0;transform-origin:93% 9%;transition:transform 1s cubic-bezier(.45,.05,.2,1);z-index:3;pointer-events:none;filter:drop-shadow(3px 5px 5px rgba(0,0,0,.45))}
.arm.drag{transition:none}
.arm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.case{position:absolute;inset:0;z-index:0;pointer-events:none}
.case::before{content:"";position:absolute;left:-5.5%;top:2%;right:-5.5%;bottom:-7%;border-radius:20px;background:repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(150deg,#e6dcc6,#c6b693 55%,#a99878);box-shadow:0 26px 44px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.35),inset 0 -6px 14px rgba(0,0,0,.22)}
.case .stitch{position:absolute;left:-3.8%;top:4%;right:-3.8%;bottom:-5.2%;border-radius:15px;border:1.5px dashed rgba(90,70,40,.45)}
.case .deck{position:absolute;left:-2.4%;top:5.6%;right:-2.4%;bottom:-3.2%;border-radius:11px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),linear-gradient(160deg,#3a3a40,#1b1b1e);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 8px 20px rgba(0,0,0,.5)}
.case .platter{position:absolute;left:-1.5%;top:9.5%;width:93%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#232326 0 66%,#6a6a70 67%,#2b2b2f 70%,#101012 100%);box-shadow:0 5px 12px rgba(0,0,0,.65)}
.case .pivot{position:absolute;left:84.5%;top:0.5%;width:17%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#58585f,#1a1a1d 75%);box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.15)}
.case .knob{position:absolute;left:86%;top:86%;width:9%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 32%,#f3f3f3,#9a9a9a 62%,#5a5a5a);box-shadow:0 3px 6px rgba(0,0,0,.6)}
.case .knob::after{content:"";position:absolute;left:47%;top:8%;width:6%;height:34%;background:#222;border-radius:2px}
.case .slots{position:absolute;left:1.5%;top:91%;width:13%;height:5%;background:repeating-linear-gradient(0deg,#0c0c0d 0 2px,#303034 2px 4px);border-radius:3px;opacity:.9}
.case .led{position:absolute;left:78%;top:92%;width:2.6%;aspect-ratio:1;border-radius:50%;background:#5a1414;box-shadow:inset 0 0 2px #000}
.vwrap:not(.idle) .case .led{background:#ff3b30;box-shadow:0 0 8px 2px rgba(255,59,48,.7)}
.sleeve{position:absolute;left:-5%;top:11%;width:88%;aspect-ratio:1;border-radius:5px;background-size:cover;background-position:center;transform:rotate(-2.2deg);z-index:0;box-shadow:0 22px 38px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.45)}
.sleeve::before{content:"";position:absolute;inset:0;border-radius:5px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0) 38%,rgba(0,0,0,.38)),radial-gradient(circle at 70% 55%,rgba(0,0,0,.45),transparent 62%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 46px rgba(0,0,0,.35)}
.sleeve::after{content:"";position:absolute;left:3%;right:3%;top:3%;bottom:3%;border-radius:3px;border:1px solid rgba(255,255,255,.10)}
.disc{position:absolute;inset:0;transition:transform 1s cubic-bezier(.5,0,.25,1),opacity .9s ease;will-change:transform}
.disc.out{transform:translate(-118%,-4%) rotate(-14deg);opacity:0}
.disc.pre{transform:translate(118%,6%) rotate(14deg);opacity:0;transition:none}
.arm .bar{position:absolute;left:calc(93% - 2.5px);top:9%;width:5px;height:72%;background:linear-gradient(90deg,#f1f1f1,#9a9a9a 55%,#6b6b6b);border-radius:3px}
.arm .cw{position:absolute;left:calc(93% - 9px);top:-3%;width:18px;height:11%;background:linear-gradient(90deg,#d6d6d6,#6f6f6f);border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.arm .hd{position:absolute;left:calc(93% - 8px);top:76%;width:16px;height:6.5%;background:linear-gradient(180deg,#2a2a2a,#111);border-radius:2px 2px 4px 4px;transform:rotate(-10deg);transform-origin:50% 0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.hub{position:absolute;left:calc(93% - 19px);top:calc(9% - 19px);width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4f4f4,#8c8c8c 60%,#555);box-shadow:0 4px 10px rgba(0,0,0,.55),inset 0 0 0 3px rgba(0,0,0,.18);z-index:4;pointer-events:none}
.hub::after{content:"";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#999)}
@media (prefers-reduced-motion:reduce){.rec{animation-duration:20s}}

.opt .note{display:block;margin-top:2px}
#view{isolation:isolate}
.field input{width:100%}

  const chal = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ver)));

async function spCallback(urlStr) {

function npClose() { if (!NP) return; if (NP.raf) cancelAnimationFrame(NP.raf); NP.el.remove(); NP = null; }
function npSleep() {
  if (!NP) return;
  const on = !!(S.sleep.at || S.sleep.eot);
  NP.sleepb.className = 'ib' + (on ? ' on' : '');
  NP.sleepEl.style.display = on ? '' : 'none';
  if (on) NP.sleepEl.textContent = S.sleep.eot ? '🌙 Se detendrá al terminar la canción' : '🌙 Se detendrá en ' + Math.max(1, Math.ceil((S.sleep.at - Date.now()) / 60000)) + ' min';
}
function npTrack() {
  if (!NP) return; const t = cur(); if (!t) return npClose();
  ensureCol(t);
  NP.el.style.setProperty('--tint', tint(t, true, 30));
  if (S.theme.vinyl) {
    const swapIn = NP.hadVinyl && NP.lastId && NP.lastId !== t.id; const oldDisc = NP.disc;
    const v = vinylEl(t); NP.cover.replaceChildren(v.el); NP.vw = v.el; NP.rec = v.rec; NP.arm = v.arm; NP.disc = v.disc; NP.raf = 0; NP.swapping = false; NP.armAng = null;
    NP.hadVinyl = true; NP.lastId = t.id;
    v.rec.style.transform = `rotate(${(NP.ang || 0).toFixed(2)}deg)`;
    v.arm.style.transform = `rotate(${armDeg(VG.REST).toFixed(2)}deg)`;
    vinylSeek();
    if (swapIn && oldDisc && oldDisc.isConnected === false) {
      v.el.insertBefore(oldDisc, v.el.firstChild); const od = oldDisc;
      requestAnimationFrame(() => requestAnimationFrame(() => od.classList.add('out'))); setTimeout(() => od.remove(), 1300);
    }
    if (swapIn) { v.disc.classList.add('pre'); requestAnimationFrame(() => requestAnimationFrame(() => { v.disc.classList.remove('pre'); })); setTimeout(() => { if (NP && NP.arm === v.arm) npArm(); }, 800); }
    else requestAnimationFrame(() => requestAnimationFrame(npArm));
  }
  else { NP.rec = NP.arm = null; NP.cover.replaceChildren(artEl(t)); NP.cover.firstChild.classList.toggle('paused', !S.playing); }
  NP.title.textContent = t.title; NP.artist.textContent = t.artist; NP.ctxl.textContent = S.ctxTitle || t.album;
  NP.favb.className = 'ib' + (t.fav ? ' on' : ''); NP.favb.innerHTML = ic(t.fav ? 'heartf' : 'heart', 26); NP.favb.onclick = () => toggleFav(t);
}
function npState() {
  if (!NP) return;
  NP.playb.innerHTML = ic(S.playing ? 'pause' : 'play', 34); NP.playb.onclick = togglePlay;
  NP.shufb.innerHTML = ic('shuffle', 24); NP.shufb.className = 'ib' + (S.shuffle ? ' on' : ''); NP.shufb.onclick = toggleShuffle;
  NP.repb.innerHTML = ic(S.repeat === 2 ? 'repeat1' : 'repeat', 24); NP.repb.className = 'ib' + (S.repeat ? ' on' : ''); NP.repb.onclick = cycleRepeat;
  const a = NP.cover.firstChild; if (a && !NP.arm) a.classList.toggle('paused', !S.playing);
  npArmSoon();
}
let npSleepTick = 0;
function npTime(d) {
  if (!NP) return;
  if (S.sleep.at && Date.now() - npSleepTick > 15000) { npSleepTick = Date.now(); npSleep(); }
  if (NP.dragging || NP.vdrag) return; d = d || 0;
  const t = curT();
  NP.f = d ? t / d : 0; if (NP.arm && S.playing && !NP.armHold) npArm();
  NP.seekEl.value = d ? (t / d) * 1000 : 0; NP.seekEl.paint(); NP.tl.textContent = fmt(t); NP.tr.textContent = '-' + fmt(Math.max(0, d - t));
}
function openQueue() {
  openSheet('Cola', (b, close) => {
    const draw = () => {
      b.replaceChildren(); const c = cur();
      if (c) b.append(h('div', { class: 'note', style: { margin: '4px 0' } }, 'Reproduciendo'), h('div', { class: 'lrow' }, artEl(c), h('div', { class: 'tx' }, h('div', { class: 'tt on' }, c.title), h('div', { class: 'ts sec' }, c.artist))));
      b.append(h('div', { class: 'note', style: { margin: '12px 0 4px' } }, 'A continuación'));
      const up = S.queue.map((id, i) => [id, i]).filter(([, i]) => i > S.idx);
      if (!up.length) b.append(h('div', { class: 'note' }, 'No hay más canciones en la cola'));
      up.forEach(([id, i]) => { const t = byId(id); if (!t) return; b.append(h('div', { class: 'tr' }, h('button', { class: 'main', onclick: () => { S.idx = i; loadCurrent(true); close(); } }, artEl(t), h('div', { class: 'tx' }, h('div', { class: 'tt' }, t.title), h('div', { class: 'ts' }, t.artist))), h('button', { class: 'ib', html: ic('close', 20), style: { color: 'var(--sec)' }, onclick: () => { S.queue.splice(i, 1); S.orig = S.orig.filter((x) => x !== id); draw(); } }))); });
    };
    draw();
  }, true);
}

/* ===================== Render principal ===================== */
function render(keep) {
  const v = $('#view'); const y = keep ? v.scrollTop : 0; v.replaceChildren(); v.className = '';
  if (!keep) { void v.offsetWidth; v.classList.add('enter'); }
  const d = stack()[stack().length - 1];
  if (d && d.k === 'wish') renderWish(v);
  else if (d && d.k === 'folder') renderFolder(v, d);
  else if (d) renderCollection(v, d);
  else if (S.tab === 'home') renderHome(v);
  else if (S.tab === 'search') renderSearch(v);
  else if (S.tab === 'library') renderLibrary(v);
  else renderSettings(v);
  mark(); if (y) v.scrollTop = y;
}

/* ===================== Inicio ===================== */
window.MP = { S, readTags, readID3, readMP4, readFLAC, importFiles, play, playTracks, applyAudio, G };
(async function init() {
  applyTheme(); renderTabs();
  try {
    db = await openDB();
    S.tracks = await dbAll('tracks'); reindex();
    const ids = new Set(S.tracks.map((t) => t.id));
    S.playlists.forEach((p) => { p.trackIDs = p.trackIDs.filter((i) => ids.has(i)); });
  } catch (e) { console.warn(e); toast('No se pudo abrir el almacenamiento del navegador'); }
  try { if (await spCallback()) renderTabs(); } catch (e) { console.warn(e); }
  render(); renderMini();
  try { const dk = $('#dock'); const setDock = () => document.documentElement.style.setProperty('--dock', dk.offsetHeight + 'px'); if (window.ResizeObserver) new ResizeObserver(setDock).observe(dk); setDock(); } catch {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch((e) => console.warn('sw', e));
})();
